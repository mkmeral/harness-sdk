<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" width="720" height="428">
  <!-- Type: architecture (access paths). Story: the agent's direct file access is bounded by OS grants, while everything it sends through Box is decided by the policy engine before it reaches files or a remote service. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="16" y="16" width="688" height="312" rx="8"/>
  <text class="dg-eyebrow" x="32" y="40">SURROUNDING OPERATING SYSTEM</text>
  <rect class="dg-zone is-boundary" x="32" y="56" width="200" height="128" rx="8"/>
  <text class="dg-eyebrow" x="48" y="76">AGENT'S SANDBOX</text>
  <rect class="dg-zone" x="304" y="56" width="384" height="128" rx="8"/>
  <text class="dg-eyebrow" x="320" y="76">TRUSTED BOX PROCESS</text>
  <text class="dg-note" x="16" y="393">An allowed request doesn't contain the remote service</text>

  <!-- Edges -->
  <path class="dg-edge" d="M216,128 H318" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M496,128 H542" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M132,156 V246" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M380,164 V268 Q380,276 372,276 H218" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M436,164 V380 Q436,388 444,388 H526" marker-end="url(#arrow)"/>

  <!-- Edge labels: each names the control on that path -->
  <rect class="dg-mask is-on-zone" x="240" y="108" width="56" height="12" rx="2"/>
  <text class="dg-label" x="268" y="117" text-anchor="middle">REQUESTS</text>
  <rect class="dg-mask is-on-zone" x="506" y="108" width="28" height="12" rx="2"/>
  <text class="dg-label" x="520" y="117" text-anchor="middle">ASK</text>
  <rect class="dg-mask is-on-zone" x="138" y="211" width="64" height="12" rx="2"/>
  <text class="dg-label" x="142" y="220">OS GRANTS</text>
  <rect class="dg-mask is-on-zone" x="268" y="256" width="56" height="12" rx="2"/>
  <text class="dg-label" x="296" y="265" text-anchor="middle">FILE OPS</text>
  <rect class="dg-mask" x="460" y="368" width="50" height="12" rx="2"/>
  <text class="dg-label" x="485" y="377" text-anchor="middle">NETWORK</text>

  <!-- Nodes -->
  <rect class="dg-node" x="48" y="100" width="168" height="56" rx="6"/>
  <text class="dg-name" x="132" y="125" text-anchor="middle">Agent process</text>
  <text class="dg-sub" x="132" y="143" text-anchor="middle">and native children</text>

  <rect class="dg-node" x="320" y="92" width="176" height="72" rx="6"/>
  <text class="dg-name" x="408" y="117" text-anchor="middle">Request handlers</text>
  <text class="dg-sub" x="408" y="135" text-anchor="middle">Strands Shell · Monty</text>
  <text class="dg-sub" x="408" y="151" text-anchor="middle">egress gateway</text>

  <rect class="dg-node is-focal" x="544" y="104" width="128" height="48" rx="6"/>
  <text class="dg-name is-focal-text" x="608" y="133" text-anchor="middle">Policy engine</text>

  <rect class="dg-node is-input" x="48" y="248" width="168" height="56" rx="6"/>
  <text class="dg-name" x="132" y="273" text-anchor="middle">Files</text>
  <text class="dg-sub" x="132" y="291" text-anchor="middle">in the surrounding OS</text>

  <rect class="dg-node is-input" x="528" y="364" width="160" height="48" rx="6"/>
  <text class="dg-name" x="608" y="393" text-anchor="middle">Remote service</text>
</svg>
