<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516">
  <!-- Type: lifecycle with phase boxes (typescript). Story: initialization fires once; each invocation is bracketed by start and end events, with node events around every node the orchestrator runs. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone" x="96" y="104" width="520" height="396" rx="8"/>
  <text class="dg-eyebrow" x="112" y="124">EACH INVOCATION</text>

  <!-- Edges -->
  <path class="dg-edge" d="M256,80 V138" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M256,204 V234" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M256,360 V390" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M384,320 H416 Q424,320 424,312 V284 Q424,276 416,276 H386" marker-end="url(#arrow)"/>

  <!-- Edge labels -->
  <text class="dg-label" x="436" y="293">NEXT NODE</text>
  <text class="dg-code" x="436" y="311">MultiAgentHandoffEvent</text>

  <!-- Phases: events listed in firing order -->
  <rect class="dg-node" x="144" y="16" width="224" height="64" rx="6"/>
  <text class="dg-name" x="160" y="45">Initialization</text>
  <text class="dg-code" x="160" y="63">MultiAgentInitializedEvent</text>

  <rect class="dg-node" x="128" y="140" width="256" height="64" rx="6"/>
  <text class="dg-name" x="144" y="169">Invocation start</text>
  <text class="dg-code" x="144" y="187">BeforeMultiAgentInvocationEvent</text>

  <rect class="dg-node" x="128" y="236" width="256" height="124" rx="6"/>
  <text class="dg-name" x="144" y="265">Node execution</text>
  <text class="dg-code" x="144" y="283">BeforeNodeCallEvent</text>
  <text class="dg-code" x="144" y="303">NodeStreamUpdateEvent</text>
  <text class="dg-code" x="144" y="323">NodeResultEvent</text>
  <text class="dg-code" x="144" y="343">AfterNodeCallEvent</text>

  <rect class="dg-node" x="128" y="392" width="256" height="84" rx="6"/>
  <text class="dg-name" x="144" y="421">Invocation end</text>
  <text class="dg-code" x="144" y="439">AfterMultiAgentInvocationEvent</text>
  <text class="dg-code" x="144" y="459">MultiAgentResultEvent</text>
</svg>
