<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <!-- Type: architecture (layered, top to bottom). Story: the agent acts only through Box's shell, egress gateway, and MCP broker; each asks one Dogwood policy engine, and tools and MCP servers run in their own sandboxes. -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path class="dg-head" d="M0,0 L8,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect class="dg-zone is-boundary" x="224" y="16" width="272" height="104" rx="8"/>
  <text class="dg-eyebrow" x="240" y="36">AGENT'S SANDBOX</text>
  <rect class="dg-zone" x="16" y="160" width="688" height="232" rx="8"/>
  <text class="dg-eyebrow" x="32" y="180">BOX'S TRUSTED PROCESS</text>
  <rect class="dg-zone is-boundary" x="16" y="416" width="688" height="88" rx="8"/>
  <text class="dg-eyebrow" x="360" y="436" text-anchor="middle">EACH IN ITS OWN SANDBOX</text>

  <!-- Edges: the agent's three ways out -->
  <path class="dg-edge" d="M300,104 V132 Q300,140 292,140 H220 Q212,140 212,148 V206" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M360,104 V206" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M420,104 V132 Q420,140 428,140 H500 Q508,140 508,148 V206" marker-end="url(#arrow)"/>

  <!-- Edges: every entry point asks the policy engine -->
  <path class="dg-edge is-dashed" d="M172,264 V328 Q172,336 180,336 H262" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M360,264 V302" marker-end="url(#arrow)"/>
  <path class="dg-edge is-dashed" d="M548,264 V328 Q548,336 540,336 H458" marker-end="url(#arrow)"/>

  <!-- Edges: permitted starts -->
  <path class="dg-edge" d="M112,264 V430" marker-end="url(#arrow)"/>
  <path class="dg-edge" d="M608,264 V430" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <rect class="dg-node" x="240" y="48" width="240" height="56" rx="6"/>
  <text class="dg-name" x="360" y="73" text-anchor="middle">Agent harness</text>
  <text class="dg-sub" x="360" y="91" text-anchor="middle">such as the Strands CLI</text>

  <rect class="dg-node" x="32" y="208" width="212" height="56" rx="6"/>
  <text class="dg-name" x="138" y="233" text-anchor="middle">Strands Shell and Monty</text>
  <text class="dg-code" x="138" y="251" text-anchor="middle">bash, python</text>

  <rect class="dg-node" x="288" y="208" width="144" height="56" rx="6"/>
  <text class="dg-name" x="360" y="233" text-anchor="middle">Egress gateway</text>
  <text class="dg-sub" x="360" y="251" text-anchor="middle">TLS, credentials</text>

  <rect class="dg-node" x="476" y="208" width="212" height="56" rx="6"/>
  <text class="dg-name" x="582" y="233" text-anchor="middle">MCP broker</text>
  <text class="dg-code" x="582" y="251" text-anchor="middle">tools/list, tools/call</text>

  <rect class="dg-node is-focal" x="264" y="304" width="192" height="64" rx="6"/>
  <text class="dg-name is-focal-text" x="360" y="333" text-anchor="middle">Dogwood policy engine</text>
  <text class="dg-sub" x="360" y="351" text-anchor="middle">decides each action</text>

  <rect class="dg-node" x="48" y="432" width="128" height="56" rx="6"/>
  <text class="dg-name" x="112" y="457" text-anchor="middle">Tools</text>
  <text class="dg-code" x="112" y="475" text-anchor="middle">git, aws</text>

  <rect class="dg-node" x="528" y="432" width="160" height="56" rx="6"/>
  <text class="dg-name" x="608" y="465" text-anchor="middle">Local MCP servers</text>
</svg>
